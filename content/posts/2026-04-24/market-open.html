<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Global Stock Exchange Open Tracker</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                    sans-serif;
                color: #fff;
                background: #000;
                min-height: 100vh;
                padding: 18px;
            }

            .wrap {
                max-width: 1100px;
                margin: 0 auto;
                border: 1px solid #222;
                border-radius: 4px;
                overflow: hidden;
                background: #000;
            }

            .header {
                padding: 14px;
                border-bottom: 1px solid #222;
            }

            .title {
                font-size: 1.05rem;
                font-weight: 700;
                letter-spacing: 0.03em;
                text-transform: uppercase;
            }

            .subtitle {
                margin-top: 5px;
                color: #888;
                font-size: 0.8rem;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.86rem;
            }

            thead th {
                text-align: left;
                color: #888;
                font-size: 0.72rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                font-weight: 500;
                padding: 8px 14px;
                border-bottom: 1px solid #222;
            }

            tbody td {
                padding: 8px 14px;
                border-bottom: 1px solid #111;
                vertical-align: middle;
            }

            tbody tr:hover td {
                background: #111;
            }

            .exchange {
                font-weight: 600;
                font-size: 0.9rem;
            }

            .code {
                color: #777;
                font-size: 0.72rem;
                margin-left: 6px;
            }

            .status {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                font-weight: 600;
            }

            .dot {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                display: inline-block;
            }

            .dot.open {
                background: #26a69a;
            }

            .dot.closed {
                background: #ef5350;
            }

            .open-text {
                color: #fff;
            }

            .timer {
                font-variant-numeric: tabular-nums;
                font-size: 0.86rem;
                color: #eee;
            }

            .tz {
                color: #888;
                font-size: 0.78rem;
                font-variant-numeric: tabular-nums;
            }

            .foot {
                padding: 10px 14px;
                color: #666;
                font-size: 0.72rem;
                border-top: 1px solid #222;
            }

            @media (max-width: 760px) {
                body {
                    padding: 8px;
                }

                thead th,
                tbody td {
                    padding-left: 8px;
                    padding-right: 8px;
                }

                .header,
                .foot {
                    padding-left: 10px;
                    padding-right: 10px;
                }

                .tz {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <table>
                <thead>
                    <tr>
                        <th>Exchange</th>
                        <th>Status</th>
                        <th>Countdown</th>
                        <th>Timezone</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>

            <div class="foot" id="updated"></div>
        </div>

        <script>
            const exchanges = [
                {
                    name: "New Zealand Exchange",
                    code: "NZX",
                    timeZone: "Pacific/Auckland",
                    open: "10:00",
                    close: "16:45",
                },
                {
                    name: "Australian Securities Exchange",
                    code: "ASX",
                    timeZone: "Australia/Sydney",
                    open: "10:00",
                    close: "16:00",
                },
                {
                    name: "Tokyo Stock Exchange",
                    code: "TSE",
                    timeZone: "Asia/Tokyo",
                    open: "09:00",
                    close: "15:00",
                },
                {
                    name: "Hong Kong Stock Exchange",
                    code: "HKEX",
                    timeZone: "Asia/Hong_Kong",
                    open: "09:30",
                    close: "16:00",
                },
                {
                    name: "Shanghai Stock Exchange",
                    code: "SSE",
                    timeZone: "Asia/Shanghai",
                    open: "09:30",
                    close: "15:00",
                },
                {
                    name: "National Stock Exchange of India",
                    code: "NSE",
                    timeZone: "Asia/Kolkata",
                    open: "09:15",
                    close: "15:30",
                },
                {
                    name: "Euronext Paris",
                    code: "EPA",
                    timeZone: "Europe/Paris",
                    open: "09:00",
                    close: "17:30",
                },
                {
                    name: "London Stock Exchange",
                    code: "LSE",
                    timeZone: "Europe/London",
                    open: "08:00",
                    close: "16:30",
                },
                {
                    name: "Toronto Stock Exchange",
                    code: "TSX",
                    timeZone: "America/Toronto",
                    open: "09:30",
                    close: "16:00",
                },
                {
                    name: "New York Stock Exchange",
                    code: "NYSE",
                    timeZone: "America/New_York",
                    open: "09:30",
                    close: "16:00",
                },
                {
                    name: "Nasdaq",
                    code: "NASDAQ",
                    timeZone: "America/New_York",
                    open: "09:30",
                    close: "16:00",
                },
                {
                    name: "B3 Brasil Bolsa Balcao",
                    code: "B3",
                    timeZone: "America/Sao_Paulo",
                    open: "10:00",
                    close: "17:00",
                },
            ];

            const rows = document.getElementById("rows");
            const updated = document.getElementById("updated");

            function getTimeZoneOffsetMinutes(timeZone, date) {
                const parts = new Intl.DateTimeFormat("en-US", {
                    timeZone,
                    timeZoneName: "shortOffset",
                }).formatToParts(date);

                const label =
                    parts.find((p) => p.type === "timeZoneName")?.value ||
                    "GMT+0";
                const match = label.match(/GMT([+-])(\d{1,2})(?::?(\d{2}))?/);
                if (!match) return 0;
                const sign = match[1] === "+" ? 1 : -1;
                const hours = Number(match[2]);
                const mins = Number(match[3] || "0");
                return sign * (hours * 60 + mins);
            }

            function getTzLabel(offsetMinutes) {
                const sign = offsetMinutes >= 0 ? "+" : "-";
                const abs = Math.abs(offsetMinutes);
                const hours = String(Math.floor(abs / 60)).padStart(2, "0");
                const mins = String(abs % 60).padStart(2, "0");
                return `UTC${sign}${hours}:${mins}`;
            }

            function getZonedParts(date, timeZone) {
                const parts = new Intl.DateTimeFormat("en-US", {
                    timeZone,
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: false,
                    weekday: "short",
                }).formatToParts(date);

                const byType = {};
                for (const p of parts) {
                    byType[p.type] = p.value;
                }

                const weekdayMap = {
                    Sun: 0,
                    Mon: 1,
                    Tue: 2,
                    Wed: 3,
                    Thu: 4,
                    Fri: 5,
                    Sat: 6,
                };

                return {
                    year: Number(byType.year),
                    month: Number(byType.month),
                    day: Number(byType.day),
                    hour: Number(byType.hour),
                    minute: Number(byType.minute),
                    second: Number(byType.second),
                    weekday: weekdayMap[byType.weekday],
                };
            }

            function zonedDateTimeToUtc(
                timeZone,
                year,
                month,
                day,
                hour,
                minute,
            ) {
                const approxUtc = new Date(
                    Date.UTC(year, month - 1, day, hour, minute, 0),
                );
                const offset = getTimeZoneOffsetMinutes(timeZone, approxUtc);
                return new Date(approxUtc.getTime() - offset * 60 * 1000);
            }

            function nextBusinessDay(year, month, day) {
                const d = new Date(Date.UTC(year, month - 1, day));
                do {
                    d.setUTCDate(d.getUTCDate() + 1);
                } while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
                return {
                    year: d.getUTCFullYear(),
                    month: d.getUTCMonth() + 1,
                    day: d.getUTCDate(),
                };
            }

            function formatDuration(ms) {
                const total = Math.max(0, Math.floor(ms / 1000));
                const days = Math.floor(total / 86400);
                const hours = Math.floor((total % 86400) / 3600);
                const minutes = Math.floor((total % 3600) / 60);
                const seconds = total % 60;
                if (days > 0) {
                    return `${days}d ${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
                }
                return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
            }

            function getState(exchange, now) {
                const [openHour, openMinute] = exchange.open
                    .split(":")
                    .map(Number);
                const [closeHour, closeMinute] = exchange.close
                    .split(":")
                    .map(Number);
                const localNow = getZonedParts(now, exchange.timeZone);

                const openUtc = zonedDateTimeToUtc(
                    exchange.timeZone,
                    localNow.year,
                    localNow.month,
                    localNow.day,
                    openHour,
                    openMinute,
                );
                const closeUtc = zonedDateTimeToUtc(
                    exchange.timeZone,
                    localNow.year,
                    localNow.month,
                    localNow.day,
                    closeHour,
                    closeMinute,
                );

                const isWeekend =
                    localNow.weekday === 0 || localNow.weekday === 6;
                const isOpen = !isWeekend && now >= openUtc && now < closeUtc;

                if (isOpen) {
                    return {
                        open: true,
                        statusText: "Open",
                        countdownText: "Open",
                        timeToOpenMs: 0,
                    };
                }

                let nextOpenUtc;
                if (isWeekend) {
                    let target = {
                        year: localNow.year,
                        month: localNow.month,
                        day: localNow.day,
                    };
                    while (true) {
                        target = nextBusinessDay(
                            target.year,
                            target.month,
                            target.day,
                        );
                        const test = new Date(
                            Date.UTC(target.year, target.month - 1, target.day),
                        );
                        const weekday = test.getUTCDay();
                        if (weekday !== 0 && weekday !== 6) {
                            nextOpenUtc = zonedDateTimeToUtc(
                                exchange.timeZone,
                                target.year,
                                target.month,
                                target.day,
                                openHour,
                                openMinute,
                            );
                            break;
                        }
                    }
                } else if (now < openUtc) {
                    nextOpenUtc = openUtc;
                } else {
                    const target = nextBusinessDay(
                        localNow.year,
                        localNow.month,
                        localNow.day,
                    );
                    nextOpenUtc = zonedDateTimeToUtc(
                        exchange.timeZone,
                        target.year,
                        target.month,
                        target.day,
                        openHour,
                        openMinute,
                    );
                }

                return {
                    open: false,
                    statusText: "Closed",
                    countdownText: formatDuration(
                        nextOpenUtc.getTime() - now.getTime(),
                    ),
                    timeToOpenMs: nextOpenUtc.getTime() - now.getTime(),
                };
            }

            function render() {
                const now = new Date();
                const ranked = exchanges.map((exchange) => {
                    const state = getState(exchange, now);
                    const offset = getTimeZoneOffsetMinutes(
                        exchange.timeZone,
                        now,
                    );
                    return { exchange, state, offset };
                });

                ranked.sort((a, b) => {
                    if (a.state.open !== b.state.open) {
                        return a.state.open ? -1 : 1;
                    }

                    if (!a.state.open && !b.state.open) {
                        const delta =
                            a.state.timeToOpenMs - b.state.timeToOpenMs;
                        if (delta !== 0) {
                            return delta;
                        }
                    }

                    const offsetDelta = b.offset - a.offset;
                    if (offsetDelta !== 0) {
                        return offsetDelta;
                    }

                    return a.exchange.name.localeCompare(b.exchange.name);
                });

                rows.innerHTML = "";
                for (const item of ranked) {
                    const exchange = item.exchange;
                    const state = item.state;
                    const tzLabel = getTzLabel(item.offset);

                    const tr = document.createElement("tr");
                    tr.innerHTML = `
          <td>
            <span class="exchange">${exchange.name}</span>
            <span class="code">${exchange.code}</span>
          </td>
          <td>
            <span class="status">
              <span class="dot ${state.open ? "open" : "closed"}"></span>
              <span class="${state.open ? "open-text" : ""}">${state.statusText}</span>
            </span>
          </td>
          <td class="timer">${state.open ? "Open" : state.countdownText}</td>
          <td class="tz">${tzLabel} (${exchange.timeZone})</td>
        `;
                    rows.appendChild(tr);
                }

                updated.textContent = `Last updated: ${now.toLocaleString()}`;
            }

            render();
            setInterval(render, 1000);
        </script>
    </body>
</html>
