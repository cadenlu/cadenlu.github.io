const el=document.getElementById('cc');
let ch,cs,as2,vs,cType='candle';

function mk(tv){
  if(ch)ch.remove();
  ch=LightweightCharts.createChart(el,{
    width:el.clientWidth,height:el.clientHeight,
    layout:{background:{type:'solid',color:'#000'},textColor:'#888',fontSize:12},
    grid:{vertLines:{color:'#181818'},horzLines:{color:'#181818'}},
    crosshair:{
      mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{color:'#555',width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#333'},
      horzLine:{color:'#555',width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#333'}
    },
    rightPriceScale:{borderColor:'#222',scaleMargins:{top:0.1,bottom:0.2}},
    timeScale:{borderColor:'#222',timeVisible:tv,secondsVisible:false,rightOffset:5,barSpacing:tv?3:8,fixLeftEdge:true,fixRightEdge:true},
    handleScroll:{vertTouchDrag:false}
  });
  cs=ch.addCandlestickSeries({
    upColor:'#26a69a',downColor:'#ef5350',borderDownColor:'#ef5350',borderUpColor:'#26a69a',
    wickDownColor:'#ef5350',wickUpColor:'#26a69a',visible:cType==='candle'
  });
  as2=ch.addAreaSeries({
    topColor:'rgba(255,255,255,0.15)',bottomColor:'rgba(255,255,255,0)',
    lineColor:'#fff',lineWidth:2,visible:cType==='area'
  });
  vs=ch.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});
  ch.priceScale('vol').applyOptions({scaleMargins:{top:0.8,bottom:0}});
  ch.subscribeCrosshairMove(function(p){
    const o=document.getElementById('lo');
    if(!p||!p.time){o.innerHTML='';return;}
    const c=p.seriesData.get(cs);
    if(c){const cl=c.close>=c.open?'#26a69a':'#ef5350';
      o.innerHTML=`<span>O <b style="color:${cl}">${c.open.toFixed(2)}</b></span><span>H <b style="color:${cl}">${c.high.toFixed(2)}</b></span><span>L <b style="color:${cl}">${c.low.toFixed(2)}</b></span><span>C <b style="color:${cl}">${c.close.toFixed(2)}</b></span>`;
    }else{const l=p.seriesData.get(as2);if(l)o.innerHTML=`<b>${l.value.toFixed(2)}</b>`;}
  });
}

function go(r){
  const hr=r==='1D'||r==='1W';
  mk(hr);
  let cd,ld,vd;
  if(hr){
    const lt=hC[hC.length-1].time;
    const st=lt-(r==='1D'?86400:604800);
    cd=hC.filter(d=>d.time>=st);ld=hL.filter(d=>d.time>=st);vd=hV.filter(d=>d.time>=st);
  }else{
    const ls=dC[dC.length-1].time;
    const ld2=new Date(ls+'T00:00:00');
    let sd;
    if(r==='1M'){sd=new Date(ld2);sd.setMonth(sd.getMonth()-1);}
    else if(r==='YTD')sd=new Date(ld2.getFullYear(),0,1);
    else{sd=new Date(ld2);sd.setFullYear(sd.getFullYear()-1);}
    const ss=sd.toISOString().split('T')[0];
    cd=dC.filter(d=>d.time>=ss);ld=dL.filter(d=>d.time>=ss);vd=dV.filter(d=>d.time>=ss);
  }
  cs.setData(cd);as2.setData(ld);vs.setData(vd);ch.timeScale().fitContent();
  if(cd.length>0){
    const f=cd[0].open,l=cd[cd.length-1].close,d=l-f,p=((l/f)-1)*100;
    document.getElementById('hp').textContent=l.toFixed(2);
    const ce=document.getElementById('hc'),s=d>=0?'+':'';
    ce.textContent=`${s}${d.toFixed(2)} (${s}${p.toFixed(2)}%)`;
    ce.className=`chg ${d>=0?'pos':'neg'}`;
  }
}

document.querySelectorAll('.tfs button').forEach(b=>{
  b.addEventListener('click',function(){
    document.querySelectorAll('.tfs button').forEach(x=>x.classList.remove('on'));
    this.classList.add('on');go(this.dataset.r);
  });
});
document.querySelectorAll('.cts button').forEach(b=>{
  b.addEventListener('click',function(){
    document.querySelectorAll('.cts button').forEach(x=>x.classList.remove('on'));
    this.classList.add('on');cType=this.dataset.t==='candle'?'candle':'area';
    if(cs&&as2){cs.applyOptions({visible:cType==='candle'});as2.applyOptions({visible:cType==='area'});}
  });
});
new ResizeObserver(e=>{for(const x of e)if(ch)ch.applyOptions({width:x.contentRect.width,height:x.contentRect.height})}).observe(el);
go('1Y');
