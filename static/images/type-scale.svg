<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="ts-title ts-desc">
  <title id="ts-title">The site's type scale</title>
  <desc id="ts-desc">A specimen ladder showing the heading sizes used on this site, from h1 at 3.1em down to the .8em eyebrow.</desc>

  <rect width="720" height="260" fill="#f0eee6"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#1f1e1d">
    <text x="40" y="72" font-size="62" font-weight="700">Newsreader 3.1em</text>
    <text x="40" y="118" font-size="32" font-weight="600">Heading two, 1.6em</text>
    <text x="40" y="154" font-size="24" font-weight="600">Heading three, 1.2em</text>
    <text x="40" y="186" font-size="20">Body copy sits at 1.25rem on a 1.6 line height.</text>
    <text x="40" y="216" font-size="14" fill="#5e5d59">Secondary text and captions, .9em</text>
  </g>

  <g stroke="#d1cfc5" stroke-width="1">
    <line x1="40" y1="30" x2="680" y2="30"/>
    <line x1="40" y1="236" x2="680" y2="236"/>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5e5d59">
    <text x="40" y="252">opsz 60 for display · opsz 24 for text</text>
    <text x="680" y="252" text-anchor="end">ivory #f0eee6 · slate #1f1e1d</text>
  </g>
</svg>
