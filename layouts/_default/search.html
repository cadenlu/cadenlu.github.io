{{ define "main" }}
<article>
  <div class="container container--narrow">
    <header>
      <h1 class="post-title">{{ .Title }}</h1>
      {{- with .Params.subtitle }}
      <p class="post-subtitle">{{ . }}</p>
      {{- end }}
    </header>

    <div class="search-form">
      <label class="visually-hidden" for="search-input">Search</label>
      <input id="search-input" type="search" placeholder="Search titles, tags, and text…"
             autocomplete="off" spellcheck="false"
             data-index-url="{{ with site.Home.OutputFormats.Get "JSON" }}{{ .RelPermalink }}{{ end }}">
    </div>

    <p id="search-status" class="text-sm text-secondary" role="status" aria-live="polite"></p>
    <ul id="search-results" class="search-results"></ul>

    {{- with .Content }}
    <div class="rich-text">{{ . }}</div>
    {{- end }}
  </div>
</article>
{{ end }}
