{{- /* callout.html — {{< callout type="warning" title="Heads up" >}} … {{< /callout >}}
       type: note (default) | tip | warning | danger                          */ -}}
{{- $type := .Get "type" | default "note" -}}
{{- $title := .Get "title" -}}
<aside class="callout callout--{{ $type }}">
  {{- with $title }}
  <p class="callout__title">{{ . }}</p>
  {{- end }}
  {{ .Inner | markdownify }}
</aside>
